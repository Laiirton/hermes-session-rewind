name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
        python:
          - "3.12"
        node:
          - "22"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: python -m pip install --upgrade pip
      - run: >-
          python -m pip install
          "ruff>=0.6,<1"
          "mypy>=1.11,<2"
          "pytest>=8.2,<9"
          "pytest-cov>=5,<7"
          "fastapi>=0.110,<1"
          "httpx>=0.27,<1"
          "pydantic>=2,<3"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy
      - run: pytest --cov=session_rewind --cov-report=term-missing --cov-fail-under=85
      - run: npm ci
        working-directory: ui
      - run: npm run typecheck
        working-directory: ui
      - run: npm run lint
        working-directory: ui
      - run: npm run format
        working-directory: ui
      - run: npm test
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - run: git diff --exit-code plugin/desktop/plugin.js
      - run: >-
          python -c "from pathlib import Path;
          text = Path('plugin/desktop/plugin.js').read_text(encoding='utf-8');
          assert '/*' not in text and '//' not in text"
