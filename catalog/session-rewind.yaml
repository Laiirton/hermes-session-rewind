name: session-rewind
title: Rewind
description: >
  Session time machine and counterfactual lab: record every turn, fork a user
  turn with an isolated git worktree restored to that point, switch model or
  prompt, rerun, and compare outcomes with an objective verify command.
  Disclosure: stores transcripts and tool payloads locally; runs local git
  subprocesses (shadow refs, worktrees) and the user-provided verify command;
  reads state.db read-only; no network, no credentials, no telemetry, no updater.
repo: https://github.com/Laiirton/hermes-session-rewind
sha: ""
subdir: plugin
tier: community
category: desktop
maintainer: Laiirton
docs_url: https://github.com/Laiirton/hermes-session-rewind#readme
capabilities:
  provides_tools:
    - rewind_search
    - rewind_inspect
    - rewind_compare
    - rewind_bookmark
  provides_hooks:
    - on_session_start
    - on_session_end
    - on_session_finalize
    - pre_llm_call
    - post_llm_call
    - pre_api_request
    - post_api_request
    - pre_tool_call
    - post_tool_call
    - post_compaction
  provides_middleware: []
  requires_env: []
requires_hermes: ">=0.22.7"
platforms:
  - windows
  - linux
  - macos
version: "1.0.0"
known_issues: A session that is not open in the app is rerun in a new chat carrying the recorded context pack rather than branched from its transcript. Snapshots restore git-tracked files only, so a gitignored virtualenv is not carried into the worktree. Verify runs in the gateway environment; the dialog shows the exact interpreter it resolves. The fork dialog is styled with the host's own design tokens, so its surface, borders, text, status hues and primary button follow the active palette and light or dark mode; the scrim and the primary-button foreground are written out because the host writes them out too. A session whose end the gateway never reported keeps reading 'recording' until it does; the plugin records what the host tells it and does not guess that a session is over.
