[project]
name = "hermes-session-rewind"
version = "1.0.0"
description = "Session time machine and counterfactual lab for Hermes Agent"
authors = [{ name = "Lairton" }]
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8.2,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ERA", "T20", "C4", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["plugin/session_rewind", "tests"]
mypy_path = "plugin"
explicit_package_bases = true
ignore_missing_imports = true
disallow_any_unimported = false
warn_unused_ignores = true

[tool.pytest.ini_options]
pythonpath = ["plugin"]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"

[tool.coverage.run]
source = ["session_rewind"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
